<!doctype html>
<html class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍔QUADRADO LANCHES</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&amp;family=Nunito:wght@600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Nunito", sans-serif;
        margin: 0;
      }
      .font-title {
        font-family: "Fredoka One", cursive
      }
      .tab-btn {
        transition: all 0.3s;
      }
      .tab-btn.active {
        transform: scale(1.05);
        box-shadow: 0 4px 20px rgba(255, 200, 0, 0.5);
      }
      .menu-item {
        animation: slideUp 0.4s ease forwards;
        opacity: 0;
      }
      @keyframes slideUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
        from {
          opacity: 0;
          transform: translateY(20px);
        }
      }
      .bubble {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        animation: float 6s infinite ease-in-out;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      .coin-container {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-end;
      }
      .coin {
        background: linear-gradient(700deg, #9b0000, #ffd700);
        border-radius: 12px;
        padding: 4px 8px;
        font-weight: 900;
        color: #000000;
        box-shadow: 0 2px 8px rgb(87, 81, 81);
        font-size: 0.7rem;
        white-space: nowrap;
        min-width: 80px;
        text-align: center;
      }
      .coin span {
        display: block;
        font-size: 0.55rem;
        text-transform: uppercase;
        opacity: 0.8;
        margin-bottom: -2px;
      }
    </style>
  </head>

      let currentTab = 0;

      function switchTab(idx) {
        currentTab = idx;
        document.querySelectorAll(".tab-btn").forEach((btn, i) => {
          btn.classList.toggle("active", i === idx);
          btn.style.background = i === idx ? "#e74c3c" : "#4a2c17";
          btn.style.color = i === idx ? "#fff" : "#ccc";
        });
        renderMenu();
      }

      function renderMenu() {
        const data = menuData[currentTab];
        const container = document.getElementById("content");

        container.innerHTML = `
    <p class="text-center mb-4 font-bold" style="color:#87CEEB;font-size:0.9rem;">${data.subtitle}</p>
    <div class="grid gap-3">
      ${data.items
        .map(
          (item, i) => `
        <div class="menu-item flex items-center gap-3 p-3 md:p-4 rounded-xl" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,215,0,0.15);animation-delay:${i * 0.08}s;">
          <div class="text-3xl md:text-4xl flex-shrink-0">${item.emoji}</div>
          <div class="flex-1 min-w-0">
            <h3 class="font-bold text-sm md:text-base" style="color:#FFD700;">${item.name}</h3>
            <p class="text-xs md:text-sm mt-0.5" style="color:#aaa;">${item.desc}</p>
          </div>
          <div class="coin-container">
            <div class="coin"><span>${data.label1 || "Preço"}</span>R$ ${item.p1}</div>
            ${item.p2 ? `<div class="coin"><span>${data.label2}</span>R$ ${item.p2}</div>` : ""}
          </div>
        </div>
      `,
        )
        .join("")}
    </div>
  `;
